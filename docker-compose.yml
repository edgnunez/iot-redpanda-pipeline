name: iot-redpanda-pipeline

networks:
  redpanda_network:
    driver: bridge

volumes:
  redpanda-0: null
  postgres-data: null
  metabase-data: null

services:
  redpanda-0:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
    container_name: redpanda-0
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda-0:9092,external://localhost:19092
      - --rpc-addr redpanda-0:33145
      - --advertise-rpc-addr redpanda-0:33145
      - --mode dev-container
      - --smp 1
    environment:
      RP_BOOTSTRAP_USER: "superuser:${REDPANDA_SUPERUSER_PASSWORD:?Set REDPANDA_SUPERUSERPASSWORD in .env}"
    volumes:
      - redpanda-0:/var/lib/redpanda/data
      - ./bootstrap.yml:/etc/redpanda/.bootstrap.yaml
    networks:
      - redpanda_network
    ports:
      - 19092:19092
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info", "-X", "user=superuser", "-X", "pass=${REDPANDA_SUPERUSER_PASSWORD}"]
      interval: 10s
      timeout: 15s
      retries: 10
  createtopic:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
    command:
      - topic
      - create
      - classroom-temperatures
      - --partitions 3
      - --replicas 1
      - --if-not-exists
      - -X user=superuser
      - -X pass=${REDPANDA_SUPERUSER_PASSWORD}
      - -X brokers=redpanda-0:9092
    networks:
      - redpanda_network
    depends_on:
      redpanda-0:
        condition: service_healthy
  console:
    image: docker.redpanda.com/redpandadata/console:v3.11.0
    container_name: redpanda-console
    environment:
      CONFIG_FILEPATH: /etc/redpanda/console-config.yml
      KAFKA_SASL_PASSWORD: ${REDPANDA_SUPERUSER_PASSWORD}
      REDPANDA_ADMINAPI_AUTHENTICATION_BASIC_PASSWORD: ${REDPANDA_SUPERUSER_PASSWORD}
    volumes:
      - ./console-config.yml:/etc/redpanda/console-config.yml
    networks:
      - redpanda_network
    ports:
      - 8080:8080
    depends_on:
      redpanda-0:
        condition: service_healthy
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: iot_data
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - redpanda_network
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d iot_data"]
      interval: 5s
      timeout: 5s
      retries: 10

  metabase:
    image: metabase/metabase:v0.64.3.4
    container_name: metabase
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase-data:/metabase-data
    networks:
      - redpanda_network
    ports:
      - 3000:3000
    depends_on:
      postgres:
        condition: service_healthy