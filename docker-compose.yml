name: iot-redpanda-pipeline

networks:
  redpanda_network:
    driver: bridge

volumes:
  redpanda-0: null

services:
  redpanda-0:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
    container_name: redpanda-0
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda-0:9092,external://localhost:19092
      - --rpc-addr redpanda-0:33145
      - --advertise-rpc-addr redpanda-0:33145
      - --mode dev-container
      - --smp 1
    environment:
      RP_BOOTSTRAP_USER: "superuser:secretpassword"
    volumes:
      - redpanda-0:/var/lib/redpanda/data
      - ./bootstrap.yml:/etc/redpanda/.bootstrap.yaml
    networks:
      - redpanda_network
    ports:
      - 19092:19092
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info", "-X", "user=superuser", "-X", "pass=secretpassword"]
      interval: 10s
      timeout: 15s
      retries: 10
  createtopic:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
    command:
      - topic
      - create
      - classroom-temperatures
      - --partitions 3
      - --replicas 1
      - --if-not-exists
      - -X user=superuser
      - -X pass=secretpassword
      - -X brokers=redpanda-0:9092
    networks:
      - redpanda_network
    depends_on:
      redpanda-0:
        condition: service_healthy
  console:
    image: docker.redpanda.com/redpandadata/console:v3.11.0
    container_name: redpanda-console
    environment:
      CONFIG_FILEPATH: /etc/redpanda/console-config.yml
    volumes:
      - ./console-config.yml:/etc/redpanda/console-config.yml
    networks:
      - redpanda_network
    ports:
      - 8080:8080
    depends_on:
      redpanda-0:
        condition: service_healthy